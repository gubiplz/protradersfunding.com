<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Admin — {{ site_name }}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
  <!-- Osobna PWA od portalu (scope /admin, wlasne id): dzial instaluje panel
       na telefonie i dopiero taka instalacja moze na iOS dostawac web push
       o leadach. Ten sam /sw.js co portal — payload URL decyduje, ktora
       aplikacje klik w powiadomienie ma otworzyc. -->
  <link rel="manifest" href="/static/manifest-admin.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PTF Admin">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <script>/* Pre-paint theme pick (shared pf_theme2 key with the trader portal; light default —
     the key was bumped from pf_theme to reset everyone back to white once). */
  try{if(localStorage.getItem('pf_theme2')==='dark'){document.documentElement.dataset.theme='dark';
  document.querySelector('meta[name="theme-color"]').setAttribute('content','#0b0d12')}}catch(e){}
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'))</script>
  <link rel="stylesheet" href="/static/css/portal.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/css/admin.css?v={{ asset_v }}">
  <script src="/static/lib/chart.umd.min.js"></script>
<script src="/static/js/equity-chart.js?v={{ asset_v }}"></script>
<script src="/static/js/sortable.js?v={{ asset_v }}"></script>
</head>
<body class="has-botnav">

<!-- The panel starts HIDDEN. It is revealed only once the session is confirmed
     to belong to an administrator — otherwise a random visitor would see the
     whole panel navigation before the redirect kicks in. -->
<div class="app" id="app-shell" style="visibility:hidden">
  <aside class="side" id="side">
    <div class="side-head">
      <a class="brand-pill" href="/"><img src="/static/img/logo.png" alt="">
        <span class="brand-txt"><span class="brand-name">{{ site_name }}</span><span class="admin-tag">admin</span></span></a>
      <button class="icon-btn side-close" style="margin-left:auto" onclick="toggleSide(false)" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-bottom">
      <button class="sb-link theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark theme"></button>
      <button class="collapse-btn" onclick="toggleCollapse()" title="Collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="sb-txt">Collapse</span></button>
      <!-- .signout z portal.css (panel i tak go laduje) = ten sam czerwony
           przycisk co w portalu tradera, razem z wariantem zwinietym. -->
      <button class="signout" onclick="signOut()" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>
        <span class="sb-txt">Sign out</span></button>
      <div class="foot-user">
        <div class="avatar" style="background:linear-gradient(135deg,#334155,#64748b)">A</div>
        <div class="who"><div>Administrator</div><span id="tok-state">not signed in</span></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn burger" onclick="toggleSide(true)" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div><h1 id="pg-title">Overview</h1><div class="crumb" id="pg-crumb"></div></div>
      <div class="top-right">
        <button class="icon-btn" onclick="openInbox()" title="Notifications" aria-label="Notifications" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 3.7 1.3 5.2 2 6H4c.7-.8 2-2.3 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <span id="bell-dot" style="display:none;position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 3px"></span>
        </button>
        <button class="btn-o sm" onclick="openCreate()" title="Manual account" aria-label="Manual account"><span class="bt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M12 5v14M5 12h14"/></svg></span><span class="bt-label">Manual account</span></button>
        <button class="btn-o sm" onclick="openCredits()" title="Add credits" aria-label="Add credits"><span class="bt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20M16 15h2"/></svg></span><span class="bt-label">Add credits</span></button>
        <button class="btn-p sm" onclick="openGrant()" title="Grant challenge" aria-label="Grant challenge"><span class="bt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12.5h18M12 8c-2.5 0-4.5-1.3-4.5-3S9.5 2.6 12 5c2.5-2.4 4.5-1.7 4.5 0S14.5 8 12 8z"/></svg></span><span class="bt-label">Grant challenge</span></button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
  <nav class="botnav" id="botnav" aria-label="Sections"></nav>
</div>

<div class="over" id="over">
  <div class="over-bg" onclick="closeOver()"></div>
  <div class="over-panel">
    <div class="over-head"><h2 id="o-title"></h2>
      <button class="icon-btn" onclick="closeOver()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="over-body" id="o-body"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="/static/js/admin-panel.js?v={{ asset_v }}"></script>
</body>
</html>
