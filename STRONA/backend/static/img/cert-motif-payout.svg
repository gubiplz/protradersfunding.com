<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <!-- Wariant PAYOUT: ta sama geometria co cert-motif.svg, ale czesc szewronow
       i przebieg w delikatnej zieleni — wyplacony zysk. -->
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#6fa8ff" fill-opacity=".045"/>
    </pattern>
    <linearGradient id="chv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67d2ff"/>
      <stop offset="1" stop-color="#1b4bd8"/>
    </linearGradient>
    <linearGradient id="chvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0c0"/>
      <stop offset="1" stop-color="#0f9d6c"/>
    </linearGradient>
  </defs>

  <!-- delikatny ukosny pas przez gorna czesc karty -->
  <path d="M0 330 L900 120 L900 190 L0 400 Z" fill="#0f9d6c" fill-opacity=".05"/>
  <path d="M0 400 L900 190 L900 208 L0 418 Z" fill="#0f9d6c" fill-opacity=".08"/>
  <rect width="900" height="900" fill="url(#dots)"/>

  <!-- naroze gorne-prawe: zielen prowadzi, blekit dopelnia -->
  <g>
    <path d="M700 70 L790 70 L750 150 L660 150 Z" fill="url(#chvg)" fill-opacity=".14"/>
    <path d="M800 70 L890 70 L850 150 L760 150 Z" fill="url(#chv)" fill-opacity=".07"/>
    <path d="M745 165 L835 165 L795 245 L705 245 Z" fill="url(#chvg)" fill-opacity=".08"/>
    <path d="M845 165 L900 165 L900 205 L825 205 Z" fill="url(#chv)" fill-opacity=".05"/>
    <path d="M790 260 L880 260 L840 340 L750 340 Z" fill="url(#chv)" fill-opacity=".055"/>
  </g>

  <!-- naroze dolne-lewe -->
  <g>
    <path d="M60 640 L150 640 L110 720 L20 720 Z" fill="url(#chvg)" fill-opacity=".085"/>
    <path d="M105 735 L195 735 L155 815 L65 815 Z" fill="url(#chv)" fill-opacity=".05"/>
    <path d="M20 545 L110 545 L70 625 L0 625 L0 585 Z" fill="url(#chv)" fill-opacity=".045"/>
  </g>

  <!-- wznoszacy przebieg w zieleni — zrealizowana wyplata -->
  <path d="M0 720 C 140 700, 260 660, 400 630 S 680 540, 900 470"
        stroke="#5ff0c0" stroke-opacity=".09" stroke-width="2" stroke-linecap="round"/>
</svg>
